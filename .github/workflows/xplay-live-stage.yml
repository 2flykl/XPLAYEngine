name: XPLAY Live Stage

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "xplay-live-stage"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install clean dependencies
        run: |
          rm -rf node_modules
          npm install --no-audit --no-fund


      - name: Release-candidate verification
        run: npm run verify:rc

      - name: Build static live stage
        env:
          VITE_XPLAY_API_BASE_URL: ${{ vars.XPLAY_API_BASE_URL }}
        run: npm run build
        env:
          VITE_XPLAY_API_BASE_URL: ${{ vars.XPLAY_API_BASE_URL }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload stage artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy XPLAY Stage
        id: deployment
        uses: actions/deploy-pages@v4
