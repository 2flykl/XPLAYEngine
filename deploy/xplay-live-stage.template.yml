name: XPLAY Live Stage

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "xplay-live-stage"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: __PROJECT_SUBDIR__
        run: npm install --no-audit --no-fund

      - name: Release-candidate verification
        working-directory: __PROJECT_SUBDIR__
        run: npm run verify:rc

      - name: Build static live stage
        working-directory: __PROJECT_SUBDIR__
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload stage artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: __DIST_PATH__

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy XPLAY Stage
        id: deployment
        uses: actions/deploy-pages@v4
