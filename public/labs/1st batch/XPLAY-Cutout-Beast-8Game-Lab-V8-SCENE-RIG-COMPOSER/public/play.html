<!doctype html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>XPLAY Playable</title>
<style>
html,body{margin:0;height:100%;background:#02060b;color:#fff;font-family:Inter,system-ui,Arial;overflow:hidden}
#wrap{height:100%;display:flex;flex-direction:column}
#top{height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:#07131f;border-bottom:1px solid #28445a}
#brand{font-weight:900;font-size:22px;color:#54ddff}.sub{font-size:12px;color:#9db1c1}
#game{flex:1;position:relative;min-height:0}
canvas{width:100%;height:100%;display:block;background:#000}
#help{position:absolute;left:16px;bottom:16px;background:#06101acc;border:1px solid #5a7990;border-radius:10px;padding:10px 12px;font-size:12px;max-width:460px;backdrop-filter:blur(5px)}
#help b{color:#65e2ff}
#status{position:absolute;right:16px;top:16px;background:#06101acc;border:1px solid #5a7990;border-radius:10px;padding:10px 12px;font-size:12px}
</style></head>
<body><div id="wrap">
<div id="top"><div><span id="brand">XPLAY</span> <b id="title"></b><div class="sub" id="genre"></div></div><div class="sub" id="timer"></div></div>
<div id="game"><canvas id="c"></canvas><div id="status"></div><div id="help"></div></div>
</div><script src="/js/play-runtime.js"></script></body></html>
