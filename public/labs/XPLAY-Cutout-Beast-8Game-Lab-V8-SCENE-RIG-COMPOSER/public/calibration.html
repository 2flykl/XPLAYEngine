<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XPLAY Scene Rig Calibration</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,system-ui,Arial;background:#06101a;color:#eaf4ff}header{height:64px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #29455c}header b{color:#58ddff;font-size:22px}main{display:grid;grid-template-columns:360px 1fr;height:calc(100% - 64px)}aside{padding:16px;border-right:1px solid #29455c;overflow:auto;background:#091827}label{display:block;margin:12px 0;font-size:13px;color:#b9ccda}input[type=range]{width:100%}.row{display:grid;grid-template-columns:1fr 68px;gap:8px;align-items:center}.val{font:12px ui-monospace,Consolas;background:#102536;padding:6px;border-radius:6px;text-align:center}button{border:0;border-radius:9px;padding:10px 12px;font-weight:800;color:#fff;cursor:pointer;margin:4px}.save{background:#16a8c5}.pass{background:#1a9a68}.reset{background:#5b6773}#stage{overflow:hidden;background:#000}canvas{width:100%;height:100%;display:block}.note{font-size:12px;line-height:1.45;color:#a9becd;background:#102536;padding:10px;border-radius:9px;margin-top:12px}</style></head><body><header><div><b>XPLAY</b> Scene Rig Calibration</div><div id="gameTitle"></div></header><main><aside><div class="note">ZERO image-generation calls. Tune the invisible set before spending on final art.</div><h3>Camera / Ground</h3><div class="row"><label>Horizon</label><div class="val" id="horizonV"></div></div><input id="horizon" type="range" min="0.20" max="0.55" step="0.01"><div class="row"><label>Far ground</label><div class="val" id="farV"></div></div><input id="far" type="range" min="0.45" max="0.82" step="0.01"><div class="row"><label>Near ground</label><div class="val" id="nearV"></div></div><input id="near" type="range" min="0.72" max="0.96" step="0.01"><div class="row"><label>Player baseline</label><div class="val" id="baseV"></div></div><input id="base" type="range" min="0.60" max="0.94" step="0.01"><h3>Scale</h3><div class="row"><label>Player height</label><div class="val" id="playerScaleV"></div></div><input id="playerScale" type="range" min="0.10" max="0.34" step="0.01"><div class="row"><label>Enemy height</label><div class="val" id="enemyScaleV"></div></div><input id="enemyScale" type="range" min="0.08" max="0.30" step="0.01"><div class="row"><label>Prop height</label><div class="val" id="propScaleV"></div></div><input id="propScale" type="range" min="0.04" max="0.18" step="0.01"><label><input id="showGrid" type="checkbox" checked> Perspective/depth grid</label><label><input id="showActors" type="checkbox" checked> Calibration silhouettes</label><div><button class="save" id="save">Save Rig</button><button class="pass" id="pass">Mark Calibration PASS</button><button class="reset" id="reset">Reset</button></div><div class="note" id="status">Loading…</div></aside><section id="stage"><canvas id="c"></canvas></section></main><script src="/js/calibration.js"></script></body></html>
