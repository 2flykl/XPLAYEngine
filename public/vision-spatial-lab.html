<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XPLAY Spatial Vision Lab</title>
<style>
:root{font-family:Inter,system-ui,Arial;background:#eef5f6;color:#11283a}body{margin:0}.wrap{max-width:1200px;margin:auto;padding:24px}.top{display:flex;gap:14px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}.pill{display:inline-block;padding:6px 10px;border-radius:999px;background:#dff7f5;color:#087d77;font-weight:900;font-size:11px}.card{background:#fff;border:1px solid #d8e4e5;border-radius:18px;padding:16px;box-shadow:0 5px 18px rgba(0,0,0,.04)}.grid{display:grid;grid-template-columns:380px 1fr;gap:16px}.field{display:grid;gap:6px;margin:12px 0;font-size:12px;font-weight:900}textarea,input,select{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ccd9db;border-radius:11px;font:inherit}textarea{min-height:160px}.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:900;cursor:pointer}.primary{background:#18b9b1;color:#fff}.ghost{background:#fff;border:1px solid #ccd9db}.stage{position:relative;background:#07121c;border-radius:16px;overflow:hidden;min-height:420px;display:grid;place-items:center}.stage img{display:block;max-width:100%;max-height:70vh}.stage canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.checks{display:flex;flex-wrap:wrap;gap:10px;font-size:12px}.status{padding:10px 12px;border-radius:10px;background:#e7f7f5;margin-top:10px}.status.bad{background:#ffeaea;color:#922}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}pre{background:#0c1a27;color:#dce8ee;border-radius:14px;padding:14px;white-space:pre-wrap;word-break:break-word;max-height:430px;overflow:auto;font-size:12px}.legend{display:flex;gap:8px;flex-wrap:wrap;font-size:11px;margin-top:10px}.legend span{padding:4px 7px;border-radius:999px;background:#eef5f6}.actions{display:flex;gap:8px;flex-wrap:wrap}.small{font-size:12px;color:#607180;line-height:1.45}@media(max-width:900px){.grid,.two{grid-template-columns:1fr}}
</style></head><body><div class="wrap">
<div class="top"><div><div class="pill">XPLAY SPATIAL VISION LAB</div><h1>See the screenshot as game geometry</h1><p class="small">Whole-image vision + six overlapping detail tiles → boxes → contours → playfield → depth → scene graph → asset manifest.</p></div><div class="actions"><button class="btn ghost" id="loadTransfer">LOAD CURRENT XPLAY BUILD</button><button class="btn ghost" id="useXplay">USE IN XPLAY</button><button class="btn ghost" id="download">DOWNLOAD SCENE PACKET</button></div></div>
<div class="grid">
<div class="card">
<label class="field">SOURCE IMAGE<input id="file" type="file" accept="image/*"></label>
<label class="field">VISION ANALYSIS<textarea id="analysis" placeholder="Paste Gemini Vision analysis or load current XPLAY build..."></textarea></label>
<label class="field">LOCKED ENGINE<select id="engine"><option value="">not locked</option><option>runner</option><option>dodge</option><option>collect</option><option>rhythm</option><option>puzzle</option><option>fps</option><option>fighting</option><option>openworld</option><option>racing</option><option>platformer</option></select></label>
<label class="field">USER INTENT<input id="intent" placeholder="Example: control Alex through a side-scrolling brawler"></label>
<div class="checks"><label><input type="checkbox" id="gridOn" checked> grid</label><label><input type="checkbox" id="boxesOn" checked> boxes</label><label><input type="checkbox" id="masksOn" checked> contours</label><label><input type="checkbox" id="labelsOn" checked> labels</label></div>
<div class="actions" style="margin-top:14px"><button class="btn primary" id="run">RUN SPATIAL VISION</button><button class="btn ghost" id="clear">CLEAR</button></div><div id="status" class="status">Ready.</div>
<div class="legend"><span>player</span><span>enemy</span><span>world</span><span>HUD</span><span>playfield</span></div>
</div>
<div class="card"><div class="stage" id="stage"><img id="preview" alt=""><canvas id="overlay"></canvas></div></div>
</div>
<div class="two"><div class="card"><h2>Scene Graph</h2><pre id="scene">Run Spatial Vision.</pre></div><div class="card"><h2>Asset Manifest Draft</h2><pre id="manifest">Run Spatial Vision.</pre></div></div>
</div><script type="module" src="./vision-spatial-lab.js"></script></body></html>
